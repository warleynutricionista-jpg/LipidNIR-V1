[pytest]
# Executar da raiz do repositório:
#   python -m pytest -c lipidence_modular/pytest.ini lipidence_modular
pythonpath = ..
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --import-mode=importlib
markers =
    db: precisa de PostgreSQL (variável LIPIDENCE_TEST_DATABASE_URL)
    slow: teste demorado
filterwarnings =
    error::DeprecationWarning:lipidence_modular.*
